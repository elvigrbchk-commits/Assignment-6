        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
            <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script>
            $(document).ready(function () {
                console.log("jQuery is ready!")
                let isMoving = false;
                let step = 0;
                let positions = [
                    {left: 300, top: 600},
                    {left: 600, top: 0},
                    {left: 900, top: 600},
                    {left: 1200, top: 0},
                    {left: 1400, top: 600},
                    {left: 1200, top: 0},
                    {left: 900, top: 600},
                    {left: 600, top: 0},
                    {left: 300, top: 600},
                    {left: 0, top: 0}
                ];
                function moveBall() {

                    if (!isMoving) return;
                    let position = positions[step];

                    $("#ball").animate({left: position.left, top: position.top}, 1000, function () {
                        step++;
                        if (step >= positions.length) {step = 0;}
                            moveBall();
                        });
                }

                $("#start").on("click", function () {

                    if (!isMoving) {
                        isMoving = true;
                        moveBall();
                    }

                });

                $("#res").on("click", function () {

                    isMoving = false;
                    $("#ball").stop(true, false);
                    step = 0;
                    $("#ball").animate({left: 0, top:0}, 1000);});

        })
        </script>
        
        <div class="d-flex flex-column align-items-start gap-3">
            
            <div class="btn-group mt-10 px-10" role="group" aria-label="Accent theme example">   
                <button type="button" class="btn-solid theme-accent" id="start">Start</button>
                <button type="button" class="btn-solid theme-accent" id="res">Reset</button>
            </div>
            <div id="field" style="background-color: rgb(204, 255, 162); width: 1600px; height: 800px; border-radius: 5%; position: relative;" class="ms-10">
                <div id="ball" style="background-color: rgb(255, 215, 106); width: 100px; height: 100px; position: absolute; border-radius: 50%;" class="ms-10 mt-10"></div>
            </div>
        </div>
