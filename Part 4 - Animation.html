<html lang="en">

        <meta charset="utf-8">

    </head>
    <body>
       <nav class="navbar bg-1 fg-2">
        <div class="container-fluid">
            <a class="navbar-brand px-10" href="index.html">Assignment 6</a>
            <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarTogglerDemo02" aria-controls="navbarTogglerDemo02" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>
            <dialog class="drawer drawer-end" tabindex="-1" id="navbarTogglerDemo02" aria-labelledby="navbarTogglerDemo02Label">
            <div class="drawer-header">
                <h5 class="drawer-title" id="navbarTogglerDemo02Label">jQuery</h5>
                <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
            </div>
            <div class="drawer-body">
                <ul class="navbar-nav me-auto mb-2">
                <li class="nav-item"><a class="nav-link" href="index.html">Part 1. Getting Started with jQuery</a></li>
                <li class="nav-item"><a class="nav-link" href="Part 2 - jQuery Effects.html">Part 2. jQuery Effects</a></li>
                <li class="nav-item"><a class="nav-link" href="Part 3 - DOM Manipulation with jQuery.html">Part 3. DOM Manipulation with jQuery</a></li>
                <li class="nav-item"><a class="nav-link active" aria-current="page" href="Part 4 - Animation.html">Part 4. Animations</a></li>

        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
            <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script>
            $(document).ready(function () {
                console.log("jQuery is ready!")
                $("#comb").on("click", function(){$("#sqr1").animate({height: "200px", width:"200px",left: "250px", top:"330px"})})
                $("#res1").on("click", function(){$("#sqr1").animate({height: "100px", width:"100px",left: "0", top:"0"})})

                $("#right").on("click", function(){$("#sqr2").animate({left: "250px"})})
                $("#down").on("click", function(){$("#sqr2").animate({top: "260px"})})
                $("#size").on("click", function(){$("#sqr2").animate({height: "50px", width: "50px"})})
                $("#res2").on("click", function(){$("#sqr2").animate({height: "100px", width:"100px",left: "0", top:"0"})})
                
                $("#change").on("click", function(){$("#sqr3").animate({opacity: 0.4, height: "70px", width:"70px",left: "250px", top:"185px"})})
                $("#res3").on("click", function(){$("#sqr3").animate({opacity: 1.0,height: "100px", width:"100px",left: "0", top:"0"})})

            })
        </script>
        
        <div class="d-flex flex-column align-items-start gap-3">
            
            <div id="sqr1" style="background-color: rgb(163, 245, 254); width: 100px; height: 100px; position: relative;" class="rounded ms-10 mt-10"></div>
            <div class="btn-group px-10" role="group" aria-label="Accent theme example">   
                <button type="button" class="btn-solid theme-accent" id="comb">Size + position</button>
                <button type="button" class="btn-solid theme-accent" id="res1">Reset</button>

            </div> 
        
            <div id="sqr2" style="background-color: rgb(204, 254, 163); width: 100px; height: 100px; position: relative;" class="rounded ms-10 mt-10"></div>
                <div class="btn-group px-10" role="group" aria-label="Accent theme example">
                    <button type="button" class="btn-solid theme-accent" id="right">→</button>
                    <button type="button" class="btn-solid theme-accent" id="down">↓</button>
                    <button type="button" class="btn-solid theme-accent" id="size">Size</button> 
                    <button type="button" class="btn-solid theme-accent" id="res2">Reset</button>                              
                </div>
            
            <div id="sqr3" style="background-color: rgb(225, 163, 254); width: 100px; height: 100px; position: relative;" class="rounded ms-10 mt-10"></div>
            <div class="btn-group px-10" role="group" aria-label="Accent theme example">   
                <button type="button" class="btn-solid theme-accent" id="change">Change</button>
                <button type="button" class="btn-solid theme-accent" id="res3">Reset</button>
            </div> 

        </div>
    </body>
</html>
