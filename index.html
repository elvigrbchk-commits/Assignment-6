        <div class="m-4">
            <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
            <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
            <script>
                $(document).ready(function () {
                    console.log("jQuery is ready!")
                $('.greeting').html("<h1>Hello!</h1>")
                $('#task').html("<h2>It's a jQuery task!</h2>")
                $("h3").text("Nice to see you here!")
                $('#colors').on("click", function(){
                    $('.greeting').css("color", "green")
                    $('#task').css("color", "orange")
                    $("h3").css("color", "purple")
                })
                });
            </script>
            <p class="greeting px-10"></p>
            <p id="task" class="px-10"></p>
            <h3 class="px-10"></h3>
            <div class="px-10">
                <button id="colors" type="button" class="btn-outline theme-accent mt-10">Make it colorful!</button>
            </div>
        </div>
